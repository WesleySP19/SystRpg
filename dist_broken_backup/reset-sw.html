<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Reset Service Worker</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; padding:2rem; }
  pre  { background:#222; padding:1rem; border-radius:8px; }
  .ok  { color:#7f7; }
  .err { color:#f77; }
</style>
</head>
<body>
<h1>Reset do Service Worker (TOME PRO)</h1>
<pre id="log"></pre>
<p>Quando terminar, clique <a href="/index.html">aqui para abrir o app</a>.</p>
<script>
const log = document.getElementById('log');
function add(msg, cls){ const s=document.createElement('div'); s.textContent=msg; if(cls)s.className=cls; log.appendChild(s); }

(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      add('Service Workers encontrados: ' + regs.length);
      for (const r of regs) {
        const ok = await r.unregister();
        add('  unregister(' + (r.scope||'?') + ') = ' + ok, ok ? 'ok' : 'err');
      }
    } else {
      add('Service Worker API indisponivel.', 'err');
    }

    if ('caches' in window) {
      const keys = await caches.keys();
      add('Caches encontrados: ' + keys.length);
      for (const k of keys) {
        const ok = await caches.delete(k);
        add('  caches.delete(' + k + ') = ' + ok, ok ? 'ok' : 'err');
      }
    }

    add('Concluido. Recarregue o /index.html (Ctrl+F5).', 'ok');
  } catch (e) {
    add('Erro: ' + e.message, 'err');
  }
})();
</script>
</body>
</html>
