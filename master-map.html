<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMÍNIO RPG | Mesa Virtual do Mestre v6.0</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS stylesheets -->
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/sheet-theme.css">
    <link rel="stylesheet" href="assets/tmap.css">

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #0b0c10;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
        }
        #master-map-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* Override tmap-root to be full screen in this view */
        .tmap-root {
            height: 100vh !important;
            border: none !important;
        }

        /* Loading screen */
        #mm-loading {
            position: fixed;
            inset: 0;
            background: #080a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            z-index: 99999;
            font-family: 'Outfit', sans-serif;
        }
        #mm-loading .spinner {
            width: 52px;
            height: 52px;
            border: 4px solid rgba(197,160,89,0.2);
            border-top-color: #c5a059;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #mm-loading h2 {
            font-family: 'Cinzel', serif;
            color: #c5a059;
            margin: 0;
            font-size: 1.4rem;
            text-shadow: 0 0 20px rgba(197,160,89,0.3);
        }
        #mm-loading p {
            color: rgba(255,255,255,0.45);
            font-size: 0.8rem;
            margin: 0;
        }
        #mm-loading .reset-link {
            margin-top: 10px;
            color: rgba(197,160,89,0.5);
            font-size: 0.7rem;
            text-decoration: none;
        }
        #mm-loading .reset-link:hover {
            color: #c5a059;
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div id="mm-loading">
        <div class="spinner"></div>
        <h2>🗺️ MESA VIRTUAL DO MESTRE</h2>
        <p>Inicializando o Editor de Mapas...</p>
        <a href="/reset-sw.html" class="reset-link" title="Limpar cache do Service Worker caso haja problemas de carregamento">
            <i class="fa-solid fa-rotate-right"></i> Limpar cache (se travar)
        </a>
    </div>

    <div id="master-map-container"></div>

    <script type="module">
        import { TOME } from './core/Registry.js';
        import { PersistenceService } from './services/PersistenceService.js';
        import { MapManager } from './ui/components/MapManager.js';
        import { AudioService } from './services/AudioService.js';
        import { AIService } from './services/AIService.js';

        async function initMasterMap() {
            const loadingEl = document.getElementById('mm-loading');

            try {
                // 1. Register TOME services (necessary for store dependency)
                TOME.registerService('audio', new AudioService());
                TOME.registerService('ai', new AIService());

                const persistence = new PersistenceService();
                TOME.registerService('persistence', persistence);

                // 2. Initialize and load local/JSON state
                await persistence.init();
                await persistence.load();
                persistence.startAutoSave();

                // 3. Mount MapManager
                const mapManager = new MapManager({
                    store: TOME.store,
                    element: document.getElementById('master-map-container')
                });
                mapManager.mount();

                // 4. Trigger auto-resize on load
                window.dispatchEvent(new Event('resize'));

                // 5. Handle window resize
                window.addEventListener('resize', () => {
                    mapManager._resizeCanvases?.();
                });

                // 6. Hide loading screen with smooth fade
                loadingEl.style.transition = 'opacity 0.5s ease';
                loadingEl.style.opacity = '0';
                setTimeout(() => { loadingEl.remove(); }, 550);

                console.log('[MasterMap] Mesa Virtual carregada e sincronizada com sucesso.');

            } catch (err) {
                console.error('[MasterMap] Falha ao inicializar:', err);

                // Show error inside loading screen
                loadingEl.innerHTML = `
                    <div style="text-align:center; padding:40px; max-width:600px;">
                        <i class="fa-solid fa-triangle-exclamation fa-3x" style="color:#ef4444; margin-bottom:20px;"></i>
                        <h2 style="font-family:'Cinzel',serif; color:#ef4444; margin:0 0 12px;">Erro de Inicialização</h2>
                        <p style="color:rgba(255,255,255,0.6); font-size:0.85rem; margin-bottom:20px; line-height:1.6;">
                            ${err.message || err}
                        </p>
                        <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
                            <a href="/reset-sw.html" 
                               style="padding:10px 20px; background:rgba(197,160,89,0.15); border:1px solid rgba(197,160,89,0.4); border-radius:8px; color:#c5a059; text-decoration:none; font-size:0.8rem; font-weight:700;">
                                <i class="fa-solid fa-rotate-right"></i> Limpar Cache e Tentar Novamente
                            </a>
                            <button onclick="location.reload()" 
                                    style="padding:10px 20px; background:rgba(96,165,250,0.1); border:1px solid rgba(96,165,250,0.3); border-radius:8px; color:#60a5fa; font-size:0.8rem; font-weight:700; cursor:pointer;">
                                <i class="fa-solid fa-refresh"></i> Recarregar Página
                            </button>
                        </div>
                        <details style="margin-top:20px; text-align:left;">
                            <summary style="color:rgba(255,255,255,0.3); font-size:0.7rem; cursor:pointer;">Ver detalhes técnicos</summary>
                            <pre style="color:#f43f5e; font-size:0.65rem; background:rgba(0,0,0,0.4); padding:12px; border-radius:6px; margin-top:8px; white-space:pre-wrap; word-break:break-all;">${err.stack || err}</pre>
                        </details>
                    </div>
                `;
                loadingEl.style.display = 'flex';
            }
        }

        initMasterMap();
    </script>
</body>
</html>
