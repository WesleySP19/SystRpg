<!DOCTYPE html>
<html lang="pt-br" class="dark-theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMÍNIO RPG - Mesa do Mestre</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="../assets/sheet-theme.css">
    <link rel="stylesheet" href="../assets/tmap.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* No scroll on the map window */
            background-color: var(--bg-main);
        }
        #app-root {
            width: 100%;
            height: 100%;
            display: flex;
        }
        /* Override map component layout to use full screen instead of dashboard constraints */
        .tmap-root {
            width: 100vw;
            height: 100vh;
            border-radius: 0 !important;
            border: none !important;
        }
    </style>
</head>
<body>
    <div id="app-root">
        <!-- The MapManager component will mount here in full screen mode -->
    </div>
    
    <script type="module" src="../ui/pages/MasterMapApp.js"></script>
</body>
</html>
