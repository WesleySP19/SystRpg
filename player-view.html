<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMÍNIO RPG | Player View v10.0</title>
    <link rel="icon" href="assets/logo.png">
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Design System -->
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/tmap.css">

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #040507; 
            overflow: hidden; 
            font-family: 'Outfit', sans-serif; 
            height: 100vh; 
            background-image: 
                radial-gradient(at 0% 0%, rgba(197, 160, 89, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.15) 0px, transparent 50%);
        }
        #viewport {
            width: 100vw; height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #canvas-wrap {
            position: relative;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }
        .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
        
        /* Environment filters */
        body.env-night #canvas-wrap { filter: brightness(0.4) contrast(1.1) hue-rotate(-15deg) saturate(0.8); }
        body.env-dungeon #canvas-wrap { filter: brightness(0.35) contrast(1.4) sepia(0.3) saturate(0.7); }
        body.env-sepia #canvas-wrap { filter: sepia(0.8) contrast(0.9) brightness(0.8); }

        /* ── PLAYER-VIEW INITIATIVE HUD ── */
        :root {
            --accent: #c5a059;
            --accent-bright: #e5c17b;
            --danger: #ef4444;
            --success: #22c55e;
            --text-dim: #94a3b8;
            --bg-surface: #1a1d23;
        }

        #pv-init-hud {
            position: fixed;
            top: 0; right: 0;
            width: 260px;
            height: 100vh;
            background: rgba(10, 12, 16, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid rgba(197,160,89,0.18);
            display: flex;
            flex-direction: column;
            z-index: 200;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
            pointer-events: none;
            overflow: hidden;
        }

        #pv-init-hud.hud-visible {
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Gold shimmer top border */
        #pv-init-hud::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .pv-hud-header {
            padding: 14px 16px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .pv-hud-title {
            font-family: 'Cinzel', serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .pv-hud-round {
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 3px;
            font-weight: 500;
        }

        /* ── ACTIVE TURN SPOTLIGHT ── */
        .pv-spotlight {
            padding: 12px 16px;
            background: rgba(197,160,89,0.05);
            border-bottom: 1px solid rgba(197,160,89,0.12);
            flex-shrink: 0;
        }

        .pv-spotlight-label {
            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .pv-spotlight-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pv-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.04);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(197,160,89,0.3);
            animation: pv-pulse 3s ease-in-out infinite;
        }

        .pv-avatar.enemy-av {
            border-color: var(--danger);
            animation: pv-pulse-danger 2.5s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(239,68,68,0.3);
        }

        @keyframes pv-pulse {
            0%,100% { box-shadow: 0 0 12px rgba(197,160,89,0.3); }
            50%      { box-shadow: 0 0 22px rgba(197,160,89,0.55); }
        }
        @keyframes pv-pulse-danger {
            0%,100% { box-shadow: 0 0 12px rgba(239,68,68,0.3); }
            50%      { box-shadow: 0 0 22px rgba(239,68,68,0.55); }
        }

        .pv-spotlight-info {
            flex: 1;
            min-width: 0;
        }

        .pv-spotlight-name {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pv-spotlight-name.enemy-name { color: var(--danger); }

        .pv-spotlight-meta {
            font-size: 0.6rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .pv-hp-track {
            height: 5px;
            background: rgba(0,0,0,0.4);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }

        .pv-hp-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease, background 0.3s;
        }

        /* ── QUEUE LIST ── */
        .pv-queue {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            scrollbar-width: thin;
            scrollbar-color: rgba(197,160,89,0.2) transparent;
        }

        .pv-queue::-webkit-scrollbar { width: 3px; }
        .pv-queue::-webkit-scrollbar-thumb { background: rgba(197,160,89,0.2); border-radius: 3px; }

        .pv-queue-label {
            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            text-transform: uppercase;
            padding: 4px 6px 6px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 4px;
        }

        .pv-combatant {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .pv-combatant.pv-active-turn {
            background: rgba(197,160,89,0.07);
            border-color: rgba(197,160,89,0.3);
        }

        .pv-combatant.pv-dead {
            opacity: 0.3;
            filter: grayscale(0.8);
        }

        .pv-turn-num {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5rem;
            font-weight: 800;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .pv-turn-num.active-pos {
            background: rgba(197,160,89,0.15);
            border-color: var(--accent);
            color: var(--accent);
        }

        .pv-c-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.55rem;
            color: #fff;
            flex-shrink: 0;
        }

        .pv-c-avatar.type-Player { border-color: rgba(96,165,250,0.45); }
        .pv-c-avatar.type-Monster, .pv-c-avatar.type-Enemy { border-color: rgba(239,68,68,0.4); }

        .pv-c-info {
            flex: 1;
            min-width: 0;
        }

        .pv-c-name {
            font-size: 0.72rem;
            font-weight: 700;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .pv-combatant.pv-active-turn .pv-c-name { color: var(--accent-bright); }

        .pv-c-hp-mini {
            height: 2.5px;
            background: rgba(0,0,0,0.4);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 3px;
        }

        .pv-c-hp-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .pv-c-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            flex-shrink: 0;
        }

        .pv-init-val {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
        }

        .pv-conds {
            font-size: 0.6rem;
            line-height: 1;
        }

        /* ── TURN ANNOUNCE OVERLAY ── */
        #pv-turn-announce {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pv-announce-banner {
            background: rgba(10,12,16,0.9);
            border: 1px solid rgba(197,160,89,0.4);
            border-radius: 14px;
            padding: 16px 40px;
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-bright);
            text-shadow: 0 0 20px rgba(197,160,89,0.5);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            animation: pv-banner-anim 2.5s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        @keyframes pv-banner-anim {
            0%   { opacity:0; transform:scale(0.85) translateY(10px); }
            15%  { opacity:1; transform:scale(1)    translateY(0);    }
            75%  { opacity:1; transform:scale(1)    translateY(0);    }
            100% { opacity:0; transform:scale(0.95) translateY(-8px); }
        }

        /* ── HUD TOGGLE BUTTON ── */
        #pv-hud-toggle {
            position: fixed;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            background: rgba(197,160,89,0.15);
            border: 1px solid rgba(197,160,89,0.3);
            border-right: none;
            border-radius: 8px 0 0 8px;
            width: 28px;
            padding: 10px 4px;
            cursor: pointer;
            z-index: 300;
            writing-mode: vertical-rl;
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent);
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            transition: all 0.2s;
            text-align: center;
        }

        #pv-hud-toggle:hover {
            background: rgba(197,160,89,0.25);
        }

        #pv-hud-toggle.hud-open {
            right: 260px;
        }

        /* ── MOBILE RESPONSIVENESS (max-width: 600px) ── */
        @media (max-width: 600px) {
            #pv-init-hud {
                width: calc(100vw - 32px);
                border-left: 1px solid rgba(197, 160, 89, 0.3);
            }
            #pv-hud-toggle.hud-open {
                right: calc(100vw - 32px);
                background: rgba(197, 160, 89, 0.4);
            }
            .pv-spotlight {
                padding: 10px;
            }
            .pv-avatar {
                width: 32px;
                height: 32px;
                font-size: 0.75rem;
            }
            .pv-spotlight-name {
                font-size: 0.8rem;
            }
            .pv-spotlight-meta {
                font-size: 0.55rem;
            }
            .pv-queue {
                padding: 6px;
                gap: 2px;
            }
            .pv-combatant {
                padding: 5px 8px;
                gap: 6px;
            }
            .pv-c-avatar {
                width: 24px;
                height: 24px;
                font-size: 0.5rem;
            }
            .pv-c-name {
                font-size: 0.65rem;
            }
            .pv-init-val {
                font-size: 0.65rem;
            }
            .pv-c-right {
                gap: 1px;
            }
        }
    </style>
</head>
<body class="player-view">
    <!-- Viewport for map zoom, pan and drawing -->
    <div id="viewport">
        <div id="canvas-wrap">
            <canvas id="bg-canvas" class="layer"></canvas>
            <canvas id="fog-canvas" class="layer"></canvas>
            <svg id="fx-svg" class="layer" style="overflow:visible"></svg>
            <div id="token-layer" class="layer"></div>
        </div>
    </div>

    <!-- Standby Screen (Waiting for master map transmission) -->
    <div id="standby-screen" class="standby-screen">
        <div class="standby-rune-wrap">
            <svg class="standby-rune" viewBox="0 0 100 100" fill="none" stroke="currentColor">
                <circle cx="50" cy="50" r="46" stroke-width="1.5" stroke-dasharray="6 3 12 3" style="color: var(--accent); opacity: 0.8;"></circle>
                <circle cx="50" cy="50" r="40" stroke-width="0.5" stroke-dasharray="1 2" style="color: var(--accent); opacity: 0.6;"></circle>
                <circle cx="50" cy="50" r="32" stroke-width="1" stroke-dasharray="20 4 10 4" style="color: var(--accent); opacity: 0.7;"></circle>
                <!-- Runic compass spikes -->
                <path d="M50 4 L53 25 L50 28 L47 25 Z" fill="var(--accent)" opacity="0.9"></path>
                <path d="M50 96 L53 75 L50 72 L47 75 Z" fill="var(--accent)" opacity="0.9"></path>
                <path d="M4 50 L25 53 L28 50 L25 47 Z" fill="var(--accent)" opacity="0.9"></path>
                <path d="M96 50 L75 53 L72 50 L75 47 Z" fill="var(--accent)" opacity="0.9"></path>
                <!-- Arcane geometric lines -->
                <polygon points="50,18 78,66 22,66" stroke="var(--accent)" stroke-width="0.75" opacity="0.5"></polygon>
                <polygon points="50,82 78,34 22,34" stroke="var(--accent)" stroke-width="0.75" opacity="0.5"></polygon>
            </svg>
            <img class="standby-logo" src="assets/logo.png" alt="DOMÍNIO RPG Logo" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🗺️</text></svg>'">
        </div>
        <h2 class="standby-title">DOMÍNIO RPG</h2>
        <p class="standby-subtitle" id="pv-subtitle">TRANSMISSÃO ATIVA • AGUARDANDO O MESTRE</p>
        <div class="standby-sync-status" id="pv-sync-status">
            <span class="standby-sync-dot"></span>
            <span>Sincronizando Sessão...</span>
        </div>
        
        <div id="pv-join-container" style="display:none; margin-top: 20px; text-align: center;">
            <p style="color: var(--text-dim); font-size: 0.85rem; margin-bottom: 12px; font-weight: 600;">O ID foi fornecido pelo Mestre da Mesa</p>
            <div style="display:flex; gap: 8px; justify-content: center;">
                <input type="text" id="pv-mesa-input" placeholder="ID da Mesa (ex: 123456)" maxlength="6" style="background: rgba(10, 12, 16, 0.8); border: 1.5px solid rgba(197, 160, 89, 0.4); color: #fff; padding: 12px 16px; border-radius: 8px; font-family: 'Cinzel', serif; font-size: 1.1rem; text-align: center; width: 220px; outline: none; letter-spacing: 2px;">
                <button id="pv-join-btn" style="background: linear-gradient(135deg, var(--accent), var(--accent-bright)); color: #000; font-family: 'Cinzel', serif; font-weight: 900; border: none; border-radius: 8px; padding: 0 20px; cursor: pointer; box-shadow: 0 0 15px rgba(197, 160, 89, 0.3); transition: all 0.3s ease;">ENTRAR</button>
            </div>
        </div>
        <script type="module">
          import { AuthScreen } from './ui/components/AuthScreen.js';
          // Attach click handlers to the rune and logo
          const rune = document.querySelector('.standby-rune');
          const logo = document.querySelector('.standby-logo');
          const launchAuth = () => {
            const auth = new AuthScreen({
              onLogin: () => {
                // After successful login, redirect to the main application
                window.location.href = 'index.html';
              }
            });
            auth.mount();
          };
          if (rune) rune.addEventListener('click', launchAuth);
          if (logo) logo.addEventListener('click', launchAuth);

          // Multiplayer logic: check if URL has ?mesa=ID
          const urlParams = new URLSearchParams(window.location.search);
          const mesaId = urlParams.get('mesa');
          
          if (!mesaId) {
              document.getElementById('pv-subtitle').innerText = "ACESSO À MESA DO JOGADOR";
              document.getElementById('pv-sync-status').style.display = 'none';
              document.getElementById('pv-join-container').style.display = 'block';
              
              document.getElementById('pv-join-btn').addEventListener('click', () => {
                  const val = document.getElementById('pv-mesa-input').value.trim();
                  if (val.length >= 5) {
                      window.location.href = `player-view.html?mesa=${val}`;
                  } else {
                      alert("Por favor, insira o ID correto da Mesa.");
                  }
              });
          }
        </script>
    </div>

    <div class="ui-overlay" id="ui-layer"></div>

    <div id="ref-overlay" class="reference-overlay">
        <div class="reference-img-container">
            <img id="ref-img" src="" alt="Reference" class="reference-img-frame">
            <div class="reference-close-tip">Clique em qualquer lugar para fechar a referência</div>
        </div>
    </div>

    <!-- ── INITIATIVE HUD (Player View) ── -->
    <div id="pv-init-hud">
        <div class="pv-hud-header">
            <div class="pv-hud-title">
                <span>⚔️</span> ORDEM DE BATALHA
            </div>
            <div class="pv-hud-round" id="pv-round-label">Combate Inativo</div>
        </div>

        <!-- Active combatant spotlight -->
        <div class="pv-spotlight" id="pv-spotlight" style="display:none;">
            <div class="pv-spotlight-label">⚡ TURNO ATUAL</div>
            <div class="pv-spotlight-row">
                <div class="pv-avatar" id="pv-sp-avatar"></div>
                <div class="pv-spotlight-info">
                    <div class="pv-spotlight-name" id="pv-sp-name">—</div>
                    <div class="pv-spotlight-meta" id="pv-sp-meta">CA — | HP —</div>
                    <div class="pv-hp-track">
                        <div class="pv-hp-fill" id="pv-sp-hp-fill" style="width:100%; background:#22c55e;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full queue -->
        <div class="pv-queue" id="pv-queue">
            <div class="pv-queue-label">Aguardando combate...</div>
        </div>
    </div>

    <!-- HUD slide toggle -->
    <button id="pv-hud-toggle" onclick="toggleHud()" title="Mostrar/Ocultar Iniciativa">
        ⚔ INIT
    </button>

    <!-- Turn announcement overlay -->
    <div id="pv-turn-announce"></div>

    <script>
        let _hudVisible = false;
        function toggleHud() {
            _hudVisible = !_hudVisible;
            const hud = document.getElementById('pv-init-hud');
            const btn = document.getElementById('pv-hud-toggle');
            hud.classList.toggle('hud-visible', _hudVisible);
            btn.classList.toggle('hud-open', _hudVisible);
        }
        // Auto-show HUD when combat starts
        window._autoShowHud = function() {
            if (!_hudVisible) toggleHud();
        };
    </script>

    <script type="module" src="ui/player/App.js"></script>
</body>
</html>
