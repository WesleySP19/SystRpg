<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOMÍNIO RPG | Player View v6.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
        body { margin: 0; padding: 0; background: #050507; overflow: hidden; font-family: 'Outfit', sans-serif; height: 100vh; }
        #viewport {
            width: 100vw; height: 100vh;
            position: relative;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        #canvas-wrap {
            position: relative;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }
        .layer { position: absolute; inset: 0; width: 100%; height: 100%; }
        
        /* Environment filters */
        body.env-night #canvas-wrap { filter: brightness(0.4) contrast(1.1) hue-rotate(-15deg) saturate(0.8); }
        body.env-dungeon #canvas-wrap { filter: brightness(0.35) contrast(1.4) sepia(0.3) saturate(0.7); }
        body.env-sepia #canvas-wrap { filter: sepia(0.8) contrast(0.9) brightness(0.8); }

        .ui-overlay { position: absolute; top: 30px; left: 30px; z-index: 1000; pointer-events: none; }
        .combat-info {
            background: rgba(10,10,15,0.8); backdrop-filter: blur(20px);
            padding: 20px 30px; border-radius: 20px;
            border: 1px solid rgba(212,175,55,0.3); color: #fff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }

        .reference-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.95);
            display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.5s ease;
        }
        .reference-overlay.active { display: flex; }
        .reference-img { max-width: 90%; max-height: 90%; border-radius: 15px; border: 3px solid var(--accent); box-shadow: 0 0 50px rgba(212,175,55,0.2); }

        .token-p { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="player-view">
    <div id="viewport">
        <div id="canvas-wrap">
            <canvas id="bg-canvas" class="layer"></canvas>
            <canvas id="fog-canvas" class="layer"></canvas>
            <svg id="fx-svg" class="layer" style="overflow:visible"></svg>
            <div id="token-layer" class="layer"></div>
        </div>
    </div>

    <div class="ui-overlay" id="ui-layer"></div>

    <div id="ref-overlay" class="reference-overlay">
        <img id="ref-img" src="" alt="Reference" class="reference-img">
    </div>

    <script type="module">
        const viewport = document.getElementById('viewport');
        const wrap = document.getElementById('canvas-wrap');
        const bg = document.getElementById('bg-canvas');
        const fog = document.getElementById('fog-canvas');
        const fx = document.getElementById('fx-svg');
        const tokens = document.getElementById('token-layer');
        const ui = document.getElementById('ui-layer');
        const refOverlay = document.getElementById('ref-overlay');
        const refImg = document.getElementById('ref-img');

        let lastStateStr = "";
        let mapImg = new Image();
        let currentMapUrl = "";

        const ctxBg = bg.getContext('2d');
        const ctxFog = fog.getContext('2d');

        // Setup BroadcastChannel for real-time sync
        const channel = new BroadcastChannel('tome_map');
        const refChannel = new BroadcastChannel('tome_reference');

        channel.onmessage = (e) => {
            if (e.data.type === 'MAP_UPDATE') updateFromData(e.data);
        };

        refChannel.onmessage = (e) => {
            if (e.data.type === 'REFERENCE_IMAGE') showReference(e.data.data);
        };

        function showReference(data) {
            if (!data) {
                refOverlay.classList.remove('active');
                return;
            }
            refImg.src = data;
            refOverlay.classList.add('active');
            setTimeout(() => refOverlay.classList.remove('active'), 10000); // Auto-hide after 10s
        }

        function updateFromStore() {
            const stateRaw = localStorage.getItem('TOME_PRO_STATE');
            if (!stateRaw || stateRaw === lastStateStr) return;
            lastStateStr = stateRaw;

            try {
                const state = JSON.parse(stateRaw);
                
                // Environment sync
                document.body.className = 'player-view';
                if (state.currentEnvironment && state.currentEnvironment !== 'default') {
                    document.body.classList.add(`env-${state.currentEnvironment}`);
                }

                // Reference sync
                if (state.referenceBroadcast && state.referenceCurrentImg) {
                    refImg.src = state.referenceCurrentImg;
                    refOverlay.classList.add('active');
                } else {
                    refOverlay.classList.remove('active');
                }

                if (state.tacticalMap) updateFromData(state.tacticalMap);

                // Combat UI Sync
                updateCombatUI(state);
            } catch (e) { console.error(e); }
        }

        function updateFromData(data) {
            const grid = data.grid || { cellSize: 60, cols: 30, rows: 20 };
            const W = grid.cols * grid.cellSize;
            const H = grid.rows * grid.cellSize;

            if (wrap.style.width !== W + 'px') {
                wrap.style.width = W + 'px';
                wrap.style.height = H + 'px';
                bg.width = W; bg.height = H;
                fog.width = W; fog.height = H;
                fx.setAttribute('viewBox', `0 0 ${W} ${H}`);
            }

            // Map Image
            if (data.mapUrl && data.mapUrl !== currentMapUrl) {
                currentMapUrl = data.mapUrl;
                mapImg.src = data.mapUrl;
                mapImg.onload = () => renderAll(data);
            }

            renderAll(data);
        }

        function renderAll(data) {
            const grid = data.grid || { cellSize: 60, cols: 30, rows: 20 };
            const cs = grid.cellSize;
            const W = bg.width, H = bg.height;

            // 1. Background & Grid
            ctxBg.clearRect(0, 0, W, H);
            if (mapImg.complete && mapImg.naturalWidth) {
                ctxBg.drawImage(mapImg, 0, 0, W, H);
            }
            
            ctxBg.strokeStyle = 'rgba(255,255,255,0.08)';
            ctxBg.lineWidth = 1;
            for(let c=0; c<=grid.cols; c++) { ctxBg.beginPath(); ctxBg.moveTo(c*cs, 0); ctxBg.lineTo(c*cs, H); ctxBg.stroke(); }
            for(let r=0; r<=grid.rows; r++) { ctxBg.beginPath(); ctxBg.moveTo(0, r*cs); ctxBg.lineTo(W, r*cs); ctxBg.stroke(); }

            // 2. Fog of War
            ctxFog.clearRect(0, 0, W, H);
            const fogData = data.fog || { cells: {}, enabled: false };
            if (fogData.enabled) {
                for(let c=0; c<grid.cols; c++) {
                    for(let r=0; r<grid.rows; r++) {
                        const s = fogData.cells[`${c},${r}`] || 'hidden';
                        if (s === 'hidden') { ctxFog.fillStyle = '#000'; ctxFog.fillRect(c*cs, r*cs, cs, cs); }
                        else if (s === 'explored') { ctxFog.fillStyle = 'rgba(0,0,0,0.6)'; ctxFog.fillRect(c*cs, r*cs, cs, cs); }
                    }
                }
            }

            // 3. Tokens
            const tokenList = data.tokens || [];
            tokens.innerHTML = tokenList.map(t => {
                const hpPct = Math.round(t.hp.current / t.hp.max * 100);
                const hpCol = hpPct > 50 ? '#34d399' : (hpPct > 20 ? '#fbbf24' : '#f43f5e');
                const sz = (cs * 0.85);

                return `
                    <div class="token-p" style="position:absolute; left:${t.x}px; top:${t.y}px; width:${sz}px; height:${sz}px; transform:translate(-50%,-50%); opacity:${t.isDead?0.5:1}">
                        <div style="width:100%; height:100%; border-radius:50%; border:3px solid ${t.type==='monster'?'#f43f5e':'#60a5fa'}; background:${t.img?`url(${t.img}) center/cover`:'#111'}; box-shadow:0 5px 15px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-family:Cinzel; font-weight:800; font-size:${sz*0.3}px; color:#fff;">
                            ${!t.img ? (t.emoji || t.name[0]) : ''}
                            ${t.isDead ? '💀' : ''}
                        </div>
                        <div style="position:absolute; bottom:-4px; left:10%; width:80%; height:4px; background:rgba(0,0,0,0.5); border-radius:2px; overflow:hidden;">
                            <div style="height:100%; width:${hpPct}%; background:${hpCol}; transition:width 0.3s;"></div>
                        </div>
                        <div style="position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:${sz*0.18}px; color:#fff; white-space:nowrap; background:rgba(0,0,0,0.7); padding:1px 6px; border-radius:4px; font-weight:600;">${t.name}</div>
                    </div>
                `;
            }).join('');

            // 4. Effects (Simplistic SVG recreation)
            const effects = data.effects || [];
            fx.innerHTML = effects.map(eff => {
                const colors = { fire:'#ef4444', cold:'#60a5fa', lightning:'#facc15', poison:'#22c55e', default:'#d4af37' };
                const color = colors[eff.colorKey] || colors.default;
                const r = (eff.sizeFt / 5) * cs;
                
                if (eff.shape === 'sphere' || eff.shape === 'cylinder') {
                    return `<circle cx="${eff.ox}" cy="${eff.oy}" r="${r}" fill="${color}" fill-opacity="0.2" stroke="${color}" stroke-width="2" />`;
                }
                return ''; // For brevity, only spheres in player view for now
            }).join('');
        }

        function updateCombatUI(state) {
            if (state.combatActive && state.initiativeOrder?.length) {
                const idx = state.initiativeIndex || 0;
                const current = state.initiativeOrder[idx];
                if (!current) return;

                ui.innerHTML = `
                    <div class="combat-info">
                        <div style="display:flex; align-items:center; gap:20px;">
                            <div style="width:70px; height:70px; border-radius:50%; border:3px solid ${current.type==='player'?'#60a5fa':'#f43f5e'}; background:url('${current.img||''}') center/cover, #222;"></div>
                            <div>
                                <div style="font-size:0.65rem; color:var(--accent); letter-spacing:3px; text-transform:uppercase; font-weight:800;">Turno Atual</div>
                                <div style="font-size:2rem; font-family:Cinzel, serif; font-weight:900;">${current.name}</div>
                            </div>
                        </div>
                    </div>
                `;
            } else { ui.innerHTML = ''; }
        }

        setInterval(updateFromStore, 500);
        updateFromStore();
    </script>
</body>
</html>
