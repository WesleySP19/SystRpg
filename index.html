<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mesa do Mestre — Plataforma completa de RPG para D&D 5e.">
    <title>TOME V18.5 — Premium VTT</title>
    <link rel="icon" href="assets/logo.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS (V18.5) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#c5a059',
                        bgbase: '#1a1a1a'
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        serif: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>

    <!-- Design System -->
    <link rel="stylesheet" href="assets/tome-master.css?v=32">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#c5a059">

    <script type="importmap">
    {
      "imports": {
        "@preact/signals": "https://esm.sh/@preact/signals@1.2.2?external=preact",
        "preact": "https://esm.sh/preact@10.19.3",
        "preact/hooks": "https://esm.sh/preact@10.19.3/hooks",
        "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
        "konva": "https://esm.sh/konva@9.3.15"
      }
    }
    </script>    <!-- Versão e cache são gerenciados pelo Service Worker (service-worker.js) -->
    <script>
    // Limpa apenas se há um parâmetro ?reset=1 na URL (link de emergência)
    if (new URLSearchParams(location.search).get('reset') === '1') {
        (async () => {
            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    for (const r of regs) await r.unregister();
                }
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }
                console.log('[Reset] Cache limpo. Recarregando...');
                history.replaceState({}, '', '/');
                location.reload();
            } catch (e) { console.error('[Reset] Falhou:', e); }
        })();
    }
    </script>
</head>
<body>
    <div id="app-root">
        <aside id="sidebar-target" class="sidebar"></aside>
        <main id="view-target" class="main-stage"></main>
    </div>

    <!-- Discreet Floating Dice Roller -->
    <div class="dice-roller-container">
        <div class="dice-roller-tray" id="dice-tray">
            <button class="dice-btn" onclick="window.TOME.events.emit('DICE_ROLL_REQUESTED', 4)">d4</button>
            <button class="dice-btn" onclick="window.TOME.events.emit('DICE_ROLL_REQUESTED', 6)">d6</button>
            <button class="dice-btn" onclick="window.TOME.events.emit('DICE_ROLL_REQUESTED', 8)">d8</button>
            <button class="dice-btn" onclick="window.TOME.events.emit('DICE_ROLL_REQUESTED', 10)">d10</button>
            <button class="dice-btn" onclick="window.TOME.events.emit('DICE_ROLL_REQUESTED', 12)">d12</button>
            <button class="dice-btn" onclick="window.TOME.events.emit('DICE_ROLL_REQUESTED', 20)">d20</button>
        </div>
        <button class="dice-fab" onclick="document.getElementById('dice-tray').classList.toggle('active')">
            <i class="fa-solid fa-dice-d20"></i>
        </button>
    </div>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Bootstrap -->
    <script type="module">
        import { TOME } from './core/Registry.js';
        import { AudioService } from './services/AudioService.js';
        import { AIService } from './services/AIService.js';
        import { PersistenceService } from './services/PersistenceService.js';
        import { Sidebar } from './ui/components/Sidebar.js';
        import { Dashboard } from './ui/pages/Dashboard.js';
        import { Dice } from './utils/Dice.js';
        import { AuthScreen } from './ui/components/AuthScreen.js';
        import { IndexedDBService } from './services/IndexedDBService.js';
        import { TelemetryService } from './services/TelemetryService.js';
        import { FXEngine } from './services/FXEngine.js';
        (async () => {
            if (window.location.search.includes('reset=1')) {
                localStorage.removeItem('DM_JWT_TOKEN');
                localStorage.removeItem('DM_ACTIVE_TABLE');
                window.location.search = '';
                return;
            }

            // Carrega a lógica de inicialização de forma modular
            const { startApp } = await import('./ui/Boot.js');

            const token = localStorage.getItem('DM_JWT_TOKEN');
            if (!token) {
                const { AuthScreen } = await import('./ui/components/AuthScreen.js');
                const auth = new AuthScreen({ 
                    element: document.getElementById('view-target'),
                    onLogin: () => startApp()
                });
                auth.mount();
                return; // Bloqueia o carregamento até logar e escolher mesa
            }

            startApp().catch(error => {
                console.error('[Boot] Falhou:', error);
                document.getElementById('view-target').innerHTML = `
                    <div style="padding:3rem; color:#f43f5e; text-align:center; font-family:system-ui;">
                        <h2>Erro de Inicializacao</h2>
                        <p style="color:#7a7a8e;">${error && error.message ? error.message : error}</p>
                        <p style="margin-top:20px;">
                        <a href="/index.html?reset=1" style="color:#fbbf24; text-decoration:underline;">
                            Limpar cache e tentar novamente
                        </a>
                        </p>
                    </div>
                `;
            });
        })();
    </script>
</body>
</html>
